      - name: Auto-route offline/native vs web, repair silent tails, and minimize player bar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V27_AUTOROUTE'
          from pathlib import Path
          import re


          def patch(path, old, new):
              file = Path(path)
              src = file.read_text(encoding='utf-8')
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'v27 patch mismatch {path}: {count} occurrences of {old[:90]!r}')
              file.write_text(src.replace(old, new, 1), encoding='utf-8')
              print('Patched', path)


          def patch_regex(path, pattern, replacement):
              f = Path(path)
              src = f.read_text(encoding='utf-8')
              output, count = re.subn(pattern, lambda match: replacement, src, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'v27 regex mismatch {path}: {count}: {pattern[:120]}')
              f.write_text(output, encoding='utf-8')
              print('Patched', path)


          # ---- 1. Play local files natively; stream every other track in WebView ----
          # Preserve the last stable iOS18 UI and make sure the browser exists before
          # loadVideo(), even immediately after an offline/native track.
          patch('Services/Player/PlayerManager.swift',
          '''    /// Plays a track by video ID.
              func play(videoId: String) async {
                  self.logger.info("Playing video: \\(videoId) [type: \\(self.currentPlayerType.name)]")''',
          '''    /// The browser is the default ONLINE engine; offline AAC uses AVPlayer.
              /// Do not persist this automatic choice as a user settings change.
              private func prepareWebPlayerForOnlineTrack() {
                  let webPlayer = Container.shared.ytMusicWebPlayer()
