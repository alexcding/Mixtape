              '''            self.logger.error("[Player: Native] All direct audio clients failed: \(error.localizedDescription)")
                      onStateChange?(.error(error.localizedDescription))
                      onError?(error)''')
          
          # Route online tracks by preference+network. Existing offline AAC/Opus branch
          # still runs before this method, so cached songs never use cellular data.
          replace_once('Services/Player/PlayerManager.swift',
              '''    /// Plays a track by video ID.
              func play(videoId: String) async {''',
              '''    /// Avoid repeated Web fallbacks for a single native stream attempt.
              private var attemptedWebFallbackForCurrentTrack = false
          
              private func preparePreferredOnlinePlayer() {
                  let mode = UserDefaults.standard.string(forKey: "mixtape.ios18.streamingMode") ?? "auto"
                  let preferNativeAudio: Bool
                  switch mode {
                  case "audio":
                      preferNativeAudio = true
                  case "web":
                      preferNativeAudio = false
                  default:
                      preferNativeAudio = Container.shared.networkMonitor().isCellularOrExpensive
                  }
                  if preferNativeAudio {
                      let nativePlayer = Container.shared.ytMusicNativePlayer()
                      if self.audioPlayer !== nativePlayer {
                          self.audioPlayer?.stop()
                          self.audioPlayer = nativePlayer
                          setupPlayerCallbacks()
                      }
                      logger.info("Audio-only streaming selected for online track")
                  } else {
                      prepareWebPlayerForOnlineTrack()
                  }
              }
          
              /// Retain the same track/queue when a direct audio CDN URL fails.
              /// The WebView is initialized only on demand; never start a second player.
              private func fallbackToWebForCurrentTrack(videoId: String, reason: String) async {
                  guard !isPlayingOffline,
                        currentTrack?.videoId == videoId,
                        currentPlayerType == .native,
                        !attemptedWebFallbackForCurrentTrack else { return }
                  attemptedWebFallbackForCurrentTrack = true
                  logger.warning("Audio-only failed for \(videoId): \(reason); switching SAME track to Web")
                  prepareWebPlayerForOnlineTrack()
                  isPaused = false
                  isTransitioningTrack = true
                  state = .loading
                  pendingPlayVideoId = videoId
                  progress = 0
                  duration = 0
                  if !hasUserInteractedThisSession {
                      // Use the same first-play WebView consent path as normal Web playback.
                      showMiniPlayer = true
                  } else {
                      showMiniPlayer = false
                      await audioPlayer?.loadVideo(videoId: videoId)
                  }
              }
          
              /// A CDN URL can stall without failing AVPlayerItem. After 18 seconds,
              /// recover the current song rather than silently buffering forever.
              private func scheduleNativeAudioWatchdog(videoId: String) {
                  guard currentPlayerType == .native else { return }
                  Task { @MainActor [weak self] in
                      try? await Task.sleep(for: .seconds(18))
                      guard let self,
                            self.currentTrack?.videoId == videoId,
                            self.currentPlayerType == .native,
                            !self.isPlayingOffline,
                            !self.isPaused,
                            self.audioPlayer?.isPlaying != true else { return }
                      await self.fallbackToWebForCurrentTrack(videoId: videoId, reason: "direct audio timeout")
                  }
              }
          
              /// Plays a track by video ID.
              func play(videoId: String) async {''')
          
          # The v27 automatic player chooser used Web for all non-downloaded tracks;
          # only the two call sites need to change, without touching offline handling.
          replace_once('Services/Player/PlayerManager.swift',
              '''        prepareWebPlayerForOnlineTrack()
                  self.logger.info("Playing video: \(videoId) [type: \(self.currentPlayerType.name)]")''',
              '''        attemptedWebFallbackForCurrentTrack = false
                  preparePreferredOnlinePlayer()
                  self.logger.info("Playing video: \(videoId) [type: \(self.currentPlayerType.name)]")''')
          replace_once('Services/Player/PlayerManager.swift',
              '''        // A track not in the local catalog must use the working website engine.
                  // No direct CDN/native fetch is attempted for online music.
                  prepareWebPlayerForOnlineTrack()''',
              '''        // Uncached tracks use the selected streaming mode; local tracks above
                  // remain completely offline and continue to use native/VLC.
                  attemptedWebFallbackForCurrentTrack = false
                  preparePreferredOnlinePlayer()''')
          
          # First Web-only call path; schedule the native timeout *before* awaiting
          # the stream fetch (which itself can stall).
          replace_once('Services/Player/PlayerManager.swift',
              '''            // Load the video directly via audio player
                      await audioPlayer?.loadVideo(videoId: videoId)''',
              '''            // A stalled native fetch must not leave this song loading indefinitely.
                      scheduleNativeAudioWatchdog(videoId: videoId)
                      await audioPlayer?.loadVideo(videoId: videoId)''')
          replace_once('Services/Player/PlayerManager.swift',
              '''            self.showMiniPlayer = false
                      await audioPlayer?.loadVideo(videoId: song.videoId)''',
              '''            self.showMiniPlayer = false
                      scheduleNativeAudioWatchdog(videoId: song.videoId)
                      await audioPlayer?.loadVideo(videoId: song.videoId)''')
          
          # Ignore callbacks from detached native player sessions. In the original
          # implementation a late onTrackEnded could advance the queue after fallback.
          replace_once('Services/Player/PlayerManager.swift',
              '''        player.onTrackEnded = { [weak self] in
                      Task { @MainActor in
                          await self?.handleTrackEnded()
                      }
                  }''',
              '''        player.onTrackEnded = { [weak self, weak player] in
                      Task { @MainActor in
                          guard let self, let player, self.audioPlayer === player else { return }
                          await self.handleTrackEnded()
                      }
                  }''')
          replace_once('Services/Player/PlayerManager.swift',
              '''        player.onError = { [weak self] error in
                      let nsError = error as NSError
                      let underlying = nsError.userInfo[NSUnderlyingErrorKey] as? NSError
                      let underlyingDetails = underlying.map { " | underlying: \($0.domain):\($0.code)" } ?? ""
                      let details = "\(error.localizedDescription) [\(nsError.domain):\(nsError.code)]\(underlyingDetails)"
                      self?.logger.error("Audio player error: \(details)")
                      self?.state = .error(details)
                  }''',
              '''        player.onError = { [weak self, weak player] error in
                      guard let self, let player, self.audioPlayer === player else { return }
                      let nsError = error as NSError
                      let underlying = nsError.userInfo[NSUnderlyingErrorKey] as? NSError
                      let underlyingDetails = underlying.map { " | underlying: \($0.domain):\($0.code)" } ?? ""
                      let details = "\(error.localizedDescription) [\(nsError.domain):\(nsError.code)]\(underlyingDetails)"
                      self.logger.error("Audio player error: \(details)")
                      if self.currentPlayerType == .native,
                         !self.isPlayingOffline,
                         let videoId = self.currentTrack?.videoId {
                          Task { @MainActor [weak self] in
                              await self?.fallbackToWebForCurrentTrack(
                                  videoId: videoId,
                                  reason: details
                              )
                          }
                      } else {
                          self.state = .error(details)
                      }
                  }''')
          
          # Report the mode in the build log to help distinguish cellular/Web behavior.
          for key in ('mixtape.ios18.streamingMode', 'mixtape.ios18.streamingQuality'):
              assert key in Path('Views/SettingsView.swift').read_text()
          assert 'onTrackEnded?()' in Path('Services/Player/YTMusicNativePlayer.swift').read_text()  # genuine track completion still active
          print('v33 verified: settings, network mode, native AAC selection, no skip-on-error, Web fallback, watchdog')
          PY_MIXTAPE_V33
          git diff -- Services/NetworkMonitor.swift Services/Player/PlayerManager.swift Services/Player/YTMusicNativePlayer.swift Views/SettingsView.swift > "$RUNNER_TEMP/ios18-audio-only-v33.patch" || true

      - name: Diagnose direct AAC failures and avoid premature Web fallback (v34)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_MIXTAPE_V34'
          from pathlib import Path
          import re
          
          
          def replace_once(path, before, after):
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f"v34 mismatch in {path}: {count} matches for {before[:90]!r}")
              file.write_text(source.replace(before, after, 1), encoding="utf-8")
              print("v34 updated:", path)
          
          
          def replace_regex_once(path, pattern, after):
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, lambda _: after, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"v34 regex mismatch in {path}: {count} matches")
              file.write_text(updated, encoding="utf-8")
              print("v34 updated:", path)
          
          
          # The v33 watchdog starts before fetchStream and previously abandoned the native
          # player after 18 seconds. A successful fetch can take longer because each of
          # four YouTube client profiles may require a CDN probe and retry.
          replace_once('Services/Player/YTMusicNativePlayer.swift',
              '    private let streamFetcher = StreamFetcher()',
              '''    private let streamFetcher = StreamFetcher()
              /// True while the direct audio URL is being selected and checked.
              private(set) var isResolvingStream = false
              /// Time when the URL selection ended; used to give AVPlayer time to buffer.
              private(set) var nativeStreamFetchCompletedAt: Date?''')
          
          replace_once('Services/Player/YTMusicNativePlayer.swift',
              '''        self.currentVideoId = videoId
                  onStateChange?(.loading)''',
              '''        self.currentVideoId = videoId
                  self.isResolvingStream = true
                  self.nativeStreamFetchCompletedAt = nil
                  onStateChange?(.loading)''')
          
          # In v33, the guard prevents obsolete fetches from starting playback.
          # Update flags AFTER the guard so a cancelled older request cannot modify
          # the state of a newer song.
          replace_once('Services/Player/YTMusicNativePlayer.swift',
              '        guard currentVideoId == videoId else { return }',
              '''        guard currentVideoId == videoId else { return }
                  self.isResolvingStream = false
                  self.nativeStreamFetchCompletedAt = Date()''')
          
          old_watchdog = r'    private func scheduleNativeAudioWatchdog\(videoId: String\) \{[\s\S]*?\n    \}'
          new_watchdog = '''    /// Identifies the current attempt so an old watchdog cannot affect a
              /// later play request for the same video ID.
              private var nativeAudioWatchdogToken = UUID()
          
              /// Wait for URL discovery to complete before declaring audio playback stuck.
              /// Each of the four client profiles may have a slow CDN probe or 403 retry.
              /// After discovery succeeds, AVPlayer gets at least 20 seconds to start.
              private func scheduleNativeAudioWatchdog(videoId: String) {
                  guard currentPlayerType == .native else { return }
                  let token = UUID()
                  nativeAudioWatchdogToken = token
                  Task { @MainActor [weak self] in
                      for attempt in 0..<8 {
                          try? await Task.sleep(for: .seconds(15))
                          guard let self,
                                self.nativeAudioWatchdogToken == token,
                                self.currentTrack?.videoId == videoId,
                                self.currentPlayerType == .native,
                                !self.isPlayingOffline,
                                !self.isPaused,
                                self.audioPlayer?.isPlaying != true else { return }
                          if let native = self.audioPlayer as? YTMusicNativePlayer {
                              if native.isResolvingStream {
                                  if attempt < 5 {
                                      self.logger.info("Native audio discovery still in progress for \\(videoId)")
                                      continue
                                  }
                                  await self.fallbackToWebForCurrentTrack(
                                      videoId: videoId, reason: "Direct stream resolution exceeded 90 seconds"
                                  )
                                  return
                              }
                              if let finished = native.nativeStreamFetchCompletedAt,
                                 Date().timeIntervalSince(finished) < 20 {
                                  continue
                              }
                          }
                          await self.fallbackToWebForCurrentTrack(
                              videoId: videoId, reason: "AVPlayer did not begin playing direct AAC audio"
                          )
                          return
                      }
                  }
              }'''
          # The text is inserted as Swift, not as a Python f-string; keep one Swift
          # interpolation backslash in the final file.
          new_watchdog = new_watchdog.replace('\\\\(', '\\(')
          replace_regex_once('Services/Player/PlayerManager.swift', old_watchdog, new_watchdog)
          
          # Save the actual fallback cause so it is still accessible after switching
          # playback to Web. The v33 error UI loses the error on player replacement.
          replace_once('Services/Player/PlayerManager.swift',
              '''        attemptedWebFallbackForCurrentTrack = true
                  logger.warning("Audio-only failed for \\(videoId): \\(reason); switching SAME track to Web")''',
              '''        attemptedWebFallbackForCurrentTrack = true
                  // Never store signed CDN URLs in the diagnostic displayed to the user.
                  let safeReason = reason.replacingOccurrences(
                      of: #"https?://[^\\s]+"#, with: "[URL]", options: .regularExpression
                  )
                  UserDefaults.standard.set(
                      String(safeReason.prefix(900)), forKey: "mixtape.ios18.lastNativeFallback"
                  )
                  let fallbackEnabled = UserDefaults.standard.object(forKey: "mixtape.ios18.allowWebFallback") as? Bool ?? true
                  if !fallbackEnabled {
                      logger.warning("Native streaming failed, Web fallback disabled by user")
                      isTransitioningTrack = false
                      isPaused = true
                      state = .error("Audio AAC indisponible. Consultez Paramètres > Diagnostic audio.")
                      return
                  }
                  logger.warning("Audio-only failed for \\(videoId): \\(reason); switching SAME track to Web")'''.replace('\\\\(', '\\('))
          
          # A user who wishes to cap mobile usage can disable Web fallback. The
          # option defaults to enabled for compatibility with previous versions.
          replace_once('Views/SettingsView.swift',
              '    @AppStorage("mixtape.ios18.streamingQuality") private var streamingQuality = "balanced"',
              '''    @AppStorage("mixtape.ios18.streamingQuality") private var streamingQuality = "balanced"
              @AppStorage("mixtape.ios18.allowWebFallback") private var allowWebFallback = true
              @AppStorage("mixtape.ios18.lastNativeFallback") private var lastNativeFallback = ""''')
          replace_once('Views/SettingsView.swift',
              '                .disabled(streamingMode == "web")',
              '''                .disabled(streamingMode == "web")
                          Toggle("Autoriser le lecteur Web de secours", isOn: $allowWebFallback)
                              .disabled(streamingMode == "web")''')
          replace_once('Views/SettingsView.swift',
              '                // MARK: - About Section',
              '''                // MARK: - Audio diagnostics (iOS 18 compatibility)
                          if !lastNativeFallback.isEmpty {
                              Section {
                                  Text(lastNativeFallback)
                                      .font(.footnote)
                                      .textSelection(.enabled)
                                  ShareLink(item: lastNativeFallback) {
                                      Label("Partager le diagnostic", systemImage: "square.and.arrow.up")
                                  }
                              } header: {
                                  Text("Dernier échec du lecteur audio seul")
                              } footer: {
                                  Text("Une erreur HTTP 403 signifie que le serveur refuse le flux direct. Un délai dépassé peut indiquer un réseau lent ou un chargement bloqué.")
                              }
                          }
          
                          // MARK: - About Section''')
          
          print('v34 complete: watchdog respects stream discovery, native failure reason survives fallback, optional no-Web mode')
          PY_MIXTAPE_V34
          git diff -- Services/Player/PlayerManager.swift Services/Player/YTMusicNativePlayer.swift Views/SettingsView.swift > "$RUNNER_TEMP/ios18-native-diagnostics-v34.patch" || true

      - name: Prefer tested CasePaths macros version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Mixtape.xcodeproj/project.pbxproj')
          t=p.read_text()
          a,n=re.subn(r'(repositoryURL = "https://github\.com/pointfreeco/swift-case-paths";\s*requirement = \{\s*kind = upToNextMajorVersion;\s*minimumVersion = )1\.7\.2(;)',r'\g<1>1.10.0\2',t)
          if n not in (0,1): raise SystemExit('Unexpected CasePaths declaration count: '+str(n))
          if n: p.write_text(a)
          PY
          # Re-resolve old lockfile if its pin conflicts with the minimum requirement.

      - name: Install VLCKit XCFrameworks
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v carthage >/dev/null 2>&1; then brew install carthage; fi
          carthage bootstrap --use-xcframeworks --platform iOS --cache-builds 2>&1 | tee "$LOG_DIR/carthage.log"

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project Mixtape.xcodeproj \
            -scheme Mixtape \
            -clonedSourcePackagesDirPath "$SPM_SOURCES" \
            2>&1 | tee "$LOG_DIR/spm.log"
          RESOLVED='Mixtape.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
          if [ -f "$RESOLVED" ]; then cp "$RESOLVED" "$LOG_DIR/Package.resolved"; fi

      - name: Check the effective iOS deployment target and project configuration
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project Mixtape.xcodeproj -scheme Mixtape \
            -configuration Debug -sdk iphoneos -showBuildSettings \
            > "$LOG_DIR/build-settings.txt" 2>&1
          python3 - <<'PY_SETTINGS'
          from pathlib import Path
          import re
          txt = Path('build-ios18-clean/logs/build-settings.txt').read_text()
          # Only check the Mixtape app, not dependency targets with different minima.
          sections = re.split(r'(?m)^Build settings for action \w+ and target ', txt)
          sections = [chunk for chunk in sections if chunk.startswith('Mixtape:')]
          if not sections:
              raise SystemExit('Unable to find Mixtape target build settings')
          values = re.findall(r'^\s*IPHONEOS_DEPLOYMENT_TARGET = (\S+)',
                              sections[0], flags=re.M)
          if values != ['18.0']:
              raise SystemExit(f'iOS 18 deployment target not effective for Mixtape: {values}')
          print('Verified IPHONEOS_DEPLOYMENT_TARGET = 18.0')
          PY_SETTINGS

      - name: Build unsigned iOS 18 iPhone IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Mixtape.xcodeproj \
            -scheme Mixtape \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SPM_SOURCES" \
            -jobs 2 \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$LOG_DIR/xcodebuild.log"

      - name: Package Mixtape IPA for SideStore
        shell: bash
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Debug-iphoneos/Mixtape.app"
          test -d "$APP"
          file "$APP/Mixtape"
          lipo "$APP/Mixtape" -verify_arch arm64
          xcrun dwarfdump --uuid "$APP/Mixtape" > "$LOG_DIR/app-binary-uuid.txt" || true
          find "$APP" -name 'Mixtape.debug.dylib' -exec xcrun dwarfdump --uuid '{}' \; > "$LOG_DIR/debug-dylib-uuid.txt" || true
          # Give this experimental build a distinct version to avoid confusing IPA artifacts.
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.0.34' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 34' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | tee "$LOG_DIR/diagnostic-app-version.txt"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | tee -a "$LOG_DIR/diagnostic-app-version.txt"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" | tee "$LOG_DIR/minimum-ios.txt"
          grep -Fxq '18.0' "$LOG_DIR/minimum-ios.txt"
          mkdir -p "$GITHUB_WORKSPACE/ios18-payload/Payload"
          ditto "$APP" "$GITHUB_WORKSPACE/ios18-payload/Payload/Mixtape.app"
          cd "$GITHUB_WORKSPACE/ios18-payload"
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/Mixtape-iOS18-AudioDiagnostics-v34-unsigned.ipa"
          unzip -tq "$GITHUB_WORKSPACE/Mixtape-iOS18-AudioDiagnostics-v34-unsigned.ipa"

      - name: Verify embedded frameworks do not require iOS above 18
        shell: bash
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Debug-iphoneos/Mixtape.app"
          python3 - "$APP" "$LOG_DIR" <<'PY_FRAMEWORKS'
          import json
          from pathlib import Path
          import re
          import subprocess
          import sys
          app, log_dir = map(Path, sys.argv[1:])
          candidates = [app/'Mixtape']
          fwdir = app/'Frameworks'
          if fwdir.exists():
              candidates.extend(p for p in fwdir.rglob('*') if p.is_file()
                                and p.parent.suffix == '.framework'
                                and p.name == p.parent.stem)
              candidates.extend(p for p in fwdir.rglob('*.dylib') if p.is_file())
          results = []
          bad = []
          for binary in candidates:
              cmd = subprocess.run(['xcrun', 'vtool', '-show-build', '-arch', 'arm64', str(binary)],
                                   text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if cmd.returncode != 0:
                  # Not every embedded binary will have LC_BUILD_VERSION;
                  # keep the failure visible rather than claiming validation.
                  results.append({'binary': str(binary.relative_to(app)), 'status': 'unverified',
                                  'detail': cmd.stderr.strip()[:300]})
                  continue
              minima = re.findall(r'(?m)^\s*minos\s+(\d+\.\d+(?:\.\d+)?)', cmd.stdout)
              results.append({'binary': str(binary.relative_to(app)), 'minOS': minima})
              if any(tuple(map(int, (v.split('.') + ['0', '0'])[:3])) > (18, 0, 0)
                     for v in minima):
                  bad.append(f'{binary.name}: minimum iOS version {minima}')
          (log_dir/'embedded-minimum-versions.json').write_text(
              json.dumps(results, indent=2), encoding='utf-8')
          if bad:
              raise SystemExit('Frameworks incompatible with iOS 18.0: ' + '; '.join(bad))
          print('No verified arm64 embedded binary requires iOS > 18.0.')
          PY_FRAMEWORKS

      - name: Upload Mixtape for SideStore
        uses: actions/upload-artifact@v4
        with:
          name: Mixtape-iOS18-AudioDiagnostics-v34-unsigned-IPA
          path: Mixtape-iOS18-AudioDiagnostics-v34-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Save errors and compatibility patches
        if: always()
        shell: bash
        run: |
          mkdir -p "$LOG_DIR"
          if [ -f "$LOG_DIR/xcodebuild.log" ]; then
            grep -nE 'error:|fatal error:|unavailable in iOS|only available in iOS|requires iOS|BUILD FAILED|No such module|CasePathsMacros|PerceptionMacros|cannot find|undefined symbol|deployment target|linker command failed' "$LOG_DIR/xcodebuild.log" | tail -n 140 > "$LOG_DIR/ios18-errors.txt" || true
          fi
          git diff > "$LOG_DIR/all-port-changes.patch" || true
          if [ -d ios18-reports ]; then cp -R ios18-reports "$LOG_DIR/"; fi
          find "$DERIVED_DATA/Build/Products" -maxdepth 3 -name 'Mixtape.app' -print > "$LOG_DIR/app-paths.txt" 2>/dev/null || true

      - name: Upload compatibility diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mixtape-iOS18-AudioDiagnostics-v34-diagnostics
          path: build-ios18-clean/logs/
          if-no-files-found: warn
          retention-days: 14
