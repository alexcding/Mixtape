      - name: Hide Web Player after first sound and restore Mixtape controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_HIDDEN_WEB'
          import re
          from pathlib import Path


          def patch(path: str, before: str, after: str) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match for Web Player patch, got {count}: {before[:90]!r}")
              file.write_text(source.replace(before, after, 1), encoding="utf-8")
              print("Patched", path)


          # Keep the website's WKWebView mounted and barely visible. Removing it from
          # the view hierarchy entirely can interrupt playback on iOS.
          patch(
              "Coordinators/App/AppCoordinatorView.swift",
              ".frame(height: showMiniPlayer ? 540 : 1)\n                .opacity(showMiniPlayer ? 1 : 0.001)",
              ".frame(height: showMiniPlayer ? 540 : 44)\n                .opacity(showMiniPlayer ? 1 : 0.02)",
          )
          patch(
              "Coordinators/App/AppCoordinatorView.swift",
              'Button("Fermer") { playerManager.miniPlayerDismissed() }',
              'Button("Réduire") { playerManager.miniPlayerDismissed() }',
          )

          # Only auto-minimize on the FIRST successful playback in a session.
          # Match indentation and blank lines flexibly instead of depending on a
          # byte-exact, multi-line snippet that can change under earlier build steps.
          def patch_playback_state() -> None:
              path = Path("Services/Player/PlayerManager.swift")
              source = path.read_text(encoding="utf-8")
              pattern = re.compile(
                  r"(?m)^([ \t]*)self\.duration = duration[ \t]*\r?\n"
                  r"(?:[ \t]*\r?\n)?"
                  r"(?=[ \t]*// Update Now Playing info with current playback state and elapsed time)"
              )

              def replacement(match: re.Match) -> str:
                  indent = match.group(1)
                  return "\n".join([
                      indent + "self.duration = duration",
                      "",
                      indent + "// Hide Web UI only after media has actually started.",
                      indent + "// The user may reopen it without an automatic re-hide.",
                      indent + "if isPlaying, currentPlayerType == .webView,",
                      indent + "   showMiniPlayer, !hasUserInteractedThisSession {",
                      indent + "    confirmPlaybackStarted()",
                      indent + "}",
                      "",
                  ])

              updated, count = pattern.subn(replacement, source)
              if count != 1:
                  raise SystemExit(f"{path}: expected one playback-state insertion site, got {count}")
              path.write_text(updated, encoding="utf-8")
              print("Patched", path)

          patch_playback_state()

          # Provide an unobtrusive path back to the website if interaction is necessary.
          patch(
              "Player/PlayerViewModel.swift",
              "    func playPause() {",
              """    func revealWebPlayer() {
                  guard currentPlayerType == .webView else { return }
                  playerManager.showMiniPlayer = true
              }

              func playPause() {""",
          )
          patch(
              "Player/PlayerBar.swift",
              """            .buttonStyle(.plain)
                  }
                  .padding(.horizontal, 16)
                  .padding(.vertical, 10)""",
              """            .buttonStyle(.plain)

                      // The Web Player supplies audio; Mixtape keeps the native controls.
                      if viewModel.currentPlayerType == .webView {
                          Button {
                              viewModel.revealWebPlayer()
                          } label: {
                              Image(systemName: "globe")
                                  .font(.title3)
                                  .foregroundStyle(primaryTextColor)
                          }
                          .buttonStyle(.plain)
                          .accessibilityLabel("Afficher YouTube Music")
                      }
                  }
                  .padding(.horizontal, 16)
                  .padding(.vertical, 10)""",
          )

          # Ads, auth and media requests are untouched. This changes UI integration only.
          PY_HIDDEN_WEB
          git diff > "$LOG_DIR/ios18-source-changes.patch" || true

      - name: Fix iOS18 bottom tabs, hidden web strip, and YouTube Music search
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_UI_SEARCH'
          from pathlib import Path
          import re


          def exact(path: str, before: str, after: str) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f"{path}: UI/search patch expected exactly one match, got {count}: {before[:90]!r}")
              file.write_text(source.replace(before, after, 1), encoding="utf-8")
              print(f"UI/search patched {path}")


          def regex_once(path: str, pattern: str, substitute: str, flags: int = 0) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              changed, count = re.subn(pattern, substitute, source, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: UI/search regexp patch expected one match, got {count}")
              file.write_text(changed, encoding="utf-8")
              print(f"UI/search patched {path}")


          # iOS 18's ordinary TabView has a bottom tab bar which the iOS 26
          # .tabViewBottomAccessory replacement did not reserve. Place the native
          # music bar safely ABOVE the tabs and style it as an independent card.
          regex_once(
              "Utilities/MixtapeIOS18Compat.swift",
              r"self\.safeAreaInset\(edge: \.bottom, spacing: 0\)\s*\{\s*content\(\)\s*\}",
              '''self.safeAreaInset(edge: .bottom, spacing: 0) {
                                    content()
                                        .background(.regularMaterial, in: RoundedRectangle(cornerRadius: 16))
                                        .padding(.horizontal, 12)
                                        .padding(.top, 6)
                                        // TabView's iOS 18 tab bar stays interactive below.
                                        .padding(.bottom, 64)
                                }''',
          )

          # A reduced WebView used to occupy 44pts in the middle of the entire
          # app, giving a persistent translucent/dark band. Keep the ONE WebView
          # mounted but shrink the visible composite to 8x8; don't destroy it.
          exact(
              "Coordinators/App/AppCoordinatorView.swift",
              ".frame(height: showMiniPlayer ? 540 : 44)\n                .opacity(showMiniPlayer ? 1 : 0.02)",
              ".frame(width: showMiniPlayer ? nil : 8, height: showMiniPlayer ? 540 : 8)\n                .opacity(showMiniPlayer ? 1 : 0.001)",
          )
          regex_once(
              "Coordinators/App/AppCoordinatorView.swift",
              r"(?m)^(\s*)\.frame\(maxWidth: \.infinity\)\n(?=\s*\.background\(showMiniPlayer \? Color\(uiColor: \.systemBackground\) : \.clear\))",
              lambda m: m.group(1) + ".frame(maxWidth: showMiniPlayer ? .infinity : 8)\n",
          )

          # SearchResponseParser previously looked only at tabs.first and only
          # direct musicCardShelfRenderer / musicShelfRenderer in one section.
          # Traverse the known result containers, including nested card contents,
          # itemSectionRenderer, and all tabs. Deduplicate by result identifier.
          search_file = Path("Services/API/Parsers/SearchResponseParser.swift")
          source = search_file.read_text(encoding="utf-8")
          start_marker = "    /// Parses a search response.\n"
          end_marker = "    /// Parses a filtered songs-only search response.\n"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit("SearchResponseParser.swift: unable to isolate parse method")
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          new_method = '''    /// Parses mixed YouTube Music search results across supported renderer layouts.
              /// The result can be nested under tabs, shelves and Top Result cards.
              static func parse(_ data: [String: Any]) -> SearchResponse {
                  var songs: [Song] = []
                  var albums: [Album] = []
                  var artists: [Artist] = []
                  var playlists: [Playlist] = []
                  var seen = Set<String>()

                  func append(_ item: SearchResultItem?) {
                      guard let item, seen.insert(item.id).inserted else { return }
                      switch item {
                      case let .song(song): songs.append(song)
                      case let .album(album): albums.append(album)
                      case let .artist(artist): artists.append(artist)
                      case let .playlist(playlist): playlists.append(playlist)
                      }
                  }

                  // Follow only known navigation/result keys; avoid walking unrelated
                  // metadata, authentication and menu trees.
                  func visit(_ node: Any, depth: Int) {
                      guard depth < 18 else { return }
                      if let nodes = node as? [Any] {
                          for child in nodes { visit(child, depth: depth + 1) }
                          return
                      }
                      guard let object = node as? [String: Any] else { return }

                      if let card = object["musicCardShelfRenderer"] as? [String: Any] {
                          append(parseCardShelfRenderer(card) ?? parseSongCardRenderer(card))
                      }
                      if object["musicResponsiveListItemRenderer"] != nil {
                          append(parseSearchResultItem(object))
                      }
                      if let twoRow = object["musicTwoRowItemRenderer"] as? [String: Any] {
                          append(parseTwoRowRenderer(twoRow))
                      }

                      for key in ["tabbedSearchResultsRenderer", "tabs", "tabRenderer",
                                  "content", "sectionListRenderer", "contents",
                                  "itemSectionRenderer", "musicShelfRenderer",
                                  "musicCardShelfRenderer", "musicCarouselShelfRenderer",
                                  "gridRenderer", "items"] {
                          if let child = object[key] {
                              visit(child, depth: depth + 1)
                          }
                      }
                  }

                  visit(data["contents"] ?? data, depth: 0)
                  return SearchResponse(songs: songs, albums: albums, artists: artists, playlists: playlists)
              }

              /// Top Result may be a directly playable song rather than a browse item.
              private static func parseSongCardRenderer(_ card: [String: Any]) -> SearchResultItem? {
                  guard let titleData = card["title"] as? [String: Any],
                        let titleRuns = titleData["runs"] as? [[String: Any]],
                        let first = titleRuns.first,
                        let title = first["text"] as? String,
                        let endpoint = first["navigationEndpoint"] as? [String: Any],
                        let watchEndpoint = endpoint["watchEndpoint"] as? [String: Any],
                        let videoId = watchEndpoint["videoId"] as? String
                  else { return nil }

                  let thumbnails = ParsingHelpers.extractThumbnails(from: card)
                  let thumbnailURL = thumbnails.last.flatMap { URL(string: $0) }
                  let song = Song(id: videoId, title: title, artists: [], album: nil,
                                  duration: nil, thumbnailURL: thumbnailURL, videoId: videoId)
                  return .song(song)
              }

              /// Albums and playlists may appear as two-row cards in newer responses.
              private static func parseTwoRowRenderer(_ renderer: [String: Any]) -> SearchResultItem? {
                  guard let title = ParsingHelpers.extractTitle(from: renderer),
                        let endpoint = renderer["navigationEndpoint"] as? [String: Any],
                        let browse = endpoint["browseEndpoint"] as? [String: Any],
                        let browseId = browse["browseId"] as? String
                  else { return nil }

                  let thumbnails = ParsingHelpers.extractThumbnails(from: renderer)
                  let thumbnailURL = thumbnails.last.flatMap { URL(string: $0) }
                  let pageType = extractPageType(from: browse)
                  if pageType == "MUSIC_PAGE_TYPE_ALBUM" || browseId.hasPrefix("MPRE") || browseId.hasPrefix("OLAK") {
                      return .album(Album(id: browseId, title: title, artists: nil,
                                          thumbnailURL: thumbnailURL, year: nil, trackCount: nil))
                  }
                  if pageType == "MUSIC_PAGE_TYPE_ARTIST" || browseId.hasPrefix("UC") {
                      return .artist(Artist(id: browseId, name: title, thumbnailURL: thumbnailURL))
                  }
                  if pageType == "MUSIC_PAGE_TYPE_PLAYLIST" || browseId.hasPrefix("VL") || browseId.hasPrefix("PL") {
                      return .playlist(Playlist(id: browseId, title: title, description: nil,
                                                thumbnailURL: thumbnailURL, trackCount: nil, author: nil))
                  }
                  return nil
              }

          '''
          source = source[:start] + new_method + source[end:]
          needle = '''        // Try to get videoId for songs
                  if let playlistItemData = responsiveRenderer["playlistItemData"] as? [String: Any],
                     let videoId = playlistItemData["videoId"] as? String
                  {'''
          replacement = '''        // Video IDs can also be in watchEndpoint or thumbnail overlay.
                  if let videoId = ParsingHelpers.extractVideoId(from: responsiveRenderer)
                  {'''
          if source.count(needle) != 1:
              raise SystemExit("SearchResponseParser: expected one song videoId lookup")
          source = source.replace(needle, replacement, 1)
          search_file.write_text(source, encoding="utf-8")
          print("Search parser now supports tabs, item sections, card contents and direct watch endpoints")

          # If the mixed search response can't be parsed, retry via the filtered songs
          # endpoint rather than showing a generic error for every normal query.
          client = Path("Services/API/YTMusicClient.swift")
          source = client.read_text(encoding="utf-8")
          old = '''        let response = SearchResponseParser.parse(data)
                  if response.isEmpty && !query.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
                      let contentsKeys = (data["contents"] as? [String: Any])?.keys.sorted().joined(separator: ",") ?? "none"
                      throw YTMusicError.parseError(message: "Search returned no parsed results. contents keys: \\(contentsKeys)")
                  }
                  self.logger.info("Search found'''
          # Avoid hardcoding the full explanatory string since previous scripts can
          # introduce harmless whitespace changes. Require same guarded response block.
          pattern = (r"(?s)        let response = SearchResponseParser\.parse\(data\)\n"
                     r"        if response\.isEmpty && !query\.trimmingCharacters\(in: \.whitespacesAndNewlines\)\.isEmpty \{\n"
                     r".*?\n        \}\n"
                     r"(?=        self\.logger\.info\(\"Search found)")
          new = '''        var response = SearchResponseParser.parse(data)
                  if response.isEmpty && !query.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
                      // YouTube can change the mixed shelf layout independently of filtered search.
                      if let fallbackSongs = try? await searchSongs(query: query), !fallbackSongs.isEmpty {
                          self.logger.info("Mixed search parser empty; song-filter fallback returned \\(fallbackSongs.count) items")
                          response = SearchResponse(songs: fallbackSongs, albums: [], artists: [], playlists: [])
                      } else {
                          let keys = (data["contents"] as? [String: Any])?.keys.sorted().joined(separator: ",") ?? "none"
                          throw YTMusicError.parseError(message: "No supported search items in response. contents keys: \\(keys)")
                      }
                  }
          '''
          modified, n = re.subn(pattern, lambda _: new, source, count=1)
          if n != 1:
              raise SystemExit(f"YTMusicClient: couldn't locate the mixed search error block (matches: {n})")
          client.write_text(modified, encoding="utf-8")
          print("Search fallback to filtered songs added")
          PY_UI_SEARCH
          git diff > "$LOG_DIR/ios18-source-changes.patch" || true

