                              thumbnailFileName: thumbnail
                          )
                          saveCatalog()
                      }
                  }
                  await processQueue()
              }

              // MARK: - Thumbnail Caching'''
          patch('Services/Download/DownloadManager.swift', anchor, helper)

          # Move finalization out of the synchronous URLSession callback. All mutations
