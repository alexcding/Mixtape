      - name: Probe YouTube CDN and use supported AVPlayer User-Agent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CDN403'
          from pathlib import Path


          def patch(path, before, after):
              p = Path(path)
              source = p.read_text(encoding='utf-8')
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 source match, got {count}: {before[:85]!r}')
              p.write_text(source.replace(before, after, 1), encoding='utf-8')
              print('HTTP403 patch:', path)


          # The API may return a stream URL even if the CDN rejects a media download.
          # Probe a tiny byte range and try the next profile if the URL is unusable.
          patch('Services/Player/StreamFetcher.swift',
                '                // Get duration from API\n',
                r'''                // Verify CDN access before committing to this stream profile.
                          // This runs on the iPhone, not on the GitHub Actions runner.
                          var cdnStatus = try await probeAudioCDN(streamURL, client: client)
                          if cdnStatus == 403 {
                              // Some freshly issued YouTube URLs reject immediate requests.
                              logger.warning("[StreamFetcher] \(client.name): immediate CDN 403; retry after 5s")
                              try await Task.sleep(for: .seconds(5))
                              cdnStatus = try await probeAudioCDN(streamURL, client: client)
                          }
                          guard (200 ..< 300).contains(cdnStatus) else {
                              let diagnosis = "\(client.name): audio CDN HTTP \(cdnStatus) (player API returned a URL but the CDN rejected it)"
                              attemptFailures.append(diagnosis)
                              logger.warning("[StreamFetcher] \(diagnosis)")
                              continue
                          }
                          logger.info("[StreamFetcher] \(client.name): CDN probe HTTP \(cdnStatus), starting player")

                          // Get duration from API
          ''')

          patch('Services/Player/StreamFetcher.swift',
                '    // MARK: - Private Methods\n',
                r'''    // Inspect status without downloading entire tracks or revealing signed URLs.
              private func probeAudioCDN(_ url: URL, client: StreamClient) async throws -> Int {
                  var request = URLRequest(url: url)
                  request.httpMethod = "GET"
                  request.timeoutInterval = 12
                  request.setValue("bytes=0-1023", forHTTPHeaderField: "Range")
                  request.setValue(client.userAgent, forHTTPHeaderField: "User-Agent")
                  request.setValue("https://www.youtube.com", forHTTPHeaderField: "Origin")
                  request.setValue("https://www.youtube.com/", forHTTPHeaderField: "Referer")
                  let (_, response) = try await URLSession.shared.bytes(for: request)
                  guard let http = response as? HTTPURLResponse else {
                      throw YTMusicError.playbackError(message: "CDN probe received no HTTP response")
                  }
                  return http.statusCode
              }

              // MARK: - Private Methods
          ''')

          # Apple says AVURLAssetHTTPHeaderFieldsKey is unsupported. Retain only the
          # supported User-Agent option, using its documented raw key for compatibility.
          patch('Services/Player/NativePlayerSession.swift',
                '''        // Create asset with headers if provided
                  let asset: AVURLAsset
                  if let headers = headers {
                      asset = AVURLAsset(url: url, options: ["AVURLAssetHTTPHeaderFieldsKey": headers])
