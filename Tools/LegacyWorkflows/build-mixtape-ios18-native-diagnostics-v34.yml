                  if let index = downloads.firstIndex(where: { $0.id == videoId }),
                     let size = try? local.resourceValues(forKeys: [.fileSizeKey]).fileSize {
                      let old = downloads[index]
                      downloads[index] = DownloadedSong(
                          id: old.id, song: old.song, assetLocation: old.assetLocation,
                          fileSize: Int64(size), downloadedAt: old.downloadedAt,
                          thumbnailFileName: old.thumbnailFileName
                      )
                      saveCatalog()
                  }
                  UserDefaults.standard.set(true, forKey: key)
              }

              /// Validate/repair before making a just-transferred file available.
              private func finishDownloadedAudio(videoId: String, fileURL: URL, mimeType: String) async {
                  guard let originalIndex = activeTasks.firstIndex(where: { $0.id == videoId }) else { return }
                  let song = activeTasks[originalIndex].song
                  let expected = song.duration ?? expectedDurationByVideoId.removeValue(forKey: videoId)
                  await repairM4ATailIfNeeded(at: fileURL, expectedDuration: expected)
                  guard let fileSizeValue = try? fileURL.resourceValues(forKeys: [.fileSizeKey]).fileSize,
                        fileSizeValue > 2048,
                        let index = activeTasks.firstIndex(where: { $0.id == videoId }) else {
                      logger.error("Invalid downloaded file after transfer: \\(videoId)")
                      if let index = activeTasks.firstIndex(where: { $0.id == videoId }) {
                          activeTasks[index].state = .failed
                          activeTasks[index].error = "Audio file validation failed"
                      }
                      saveCatalog()
                      await processQueue()
                      return
                  }
                  activeTasks.remove(at: index)
                  downloads.removeAll { $0.id == videoId }
                  downloads.append(DownloadedSong(
                      id: videoId, song: song, assetLocation: fileURL.lastPathComponent,
                      fileSize: Int64(fileSizeValue), downloadedAt: Date(), thumbnailFileName: nil
                  ))
                  UserDefaults.standard.set(true, forKey: "mixtape.ios18.audioTailChecked.\\(videoId)")
                  saveCatalog()
                  logger.info("Downloaded and validated audio: \\(song.title), \\(fileSizeValue) bytes, \\(mimeType)")
                  Task {
