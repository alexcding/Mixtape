          #!/usr/bin/env python3
          '''iOS 18 v33: optional audio-only streaming, cellular auto mode and Web fallback.
          This builds on the verified v32 patches. Only the relevant audio files change.
          '''
          from pathlib import Path
          import re
          
          def replace_once(path, old, new):
              p = Path(path)
              source = p.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'v33 patch mismatch in {path}: {count} matches for {old[:85]!r}')
              p.write_text(source.replace(old, new, 1), encoding='utf-8')
              print(f'v33 patched {path}')
          
          def regex_once(path, pattern, replacement):
              p=Path(path)
              source=p.read_text(encoding='utf-8')
              new,count=re.subn(pattern,lambda _: replacement,source,count=1,flags=re.S)
              if count != 1:
                  raise SystemExit(f'v33 regex mismatch in {path}: {count} matches')
              p.write_text(new,encoding='utf-8')
              print(f'v33 patched {path} (regex)')
          
          # Read the actual system network route, rather than assuming cellular from Wi-Fi reachability.
          # Until NWPathMonitor answers, default conservatively to audio-only.
          replace_once('Services/NetworkMonitor.swift',
              '    private(set) var isConnected: Bool = true',
              '''    private(set) var isConnected: Bool = true
              /// Cellular or metered Wi-Fi / personal hotspot; safe default before first path update.
              private(set) var isCellularOrExpensive: Bool = true''')
          replace_once('Services/NetworkMonitor.swift',
              '                self?.isConnected = path.status == .satisfied',
              '''                self?.isConnected = path.status == .satisfied
                          self?.isCellularOrExpensive = path.usesInterfaceType(.cellular) || path.isExpensive''')
          
          # Persist streaming mode without altering AppDefaults initialization, which is
          # intentionally kept stable after previous startup crashes.
          replace_once('Views/SettingsView.swift',
              '    @AppStorage("mixtape.ios18.downloadQuality") private var downloadQuality = "balanced"',
              '''    @AppStorage("mixtape.ios18.downloadQuality") private var downloadQuality = "balanced"
              @AppStorage("mixtape.ios18.streamingMode") private var streamingMode = "auto"
              @AppStorage("mixtape.ios18.streamingQuality") private var streamingQuality = "balanced"''')
          
          regex_once('Views/SettingsView.swift',
              r'                // MARK: - Playback Section\n[\s\S]*?(?=                // MARK: - Offline download quality)',
              '''                // MARK: - Playback Section
                          Section {
                              Picker("Mode de streaming", selection: $streamingMode) {
                                  Text("Automatique (audio seul en 4G/5G)").tag("auto")
                                  Text("Audio seul (tous réseaux)").tag("audio")
                                  Text("Compatibilité Web").tag("web")
                              }
                              Picker("Qualité audio en streaming", selection: $streamingQuality) {
                                  Text("Économie (débit AAC le plus faible)").tag("economical")
                                  Text("Équilibrée (environ 128 kb/s)").tag("balanced")
                                  Text("Qualité maximale disponible").tag("maximum")
                              }
                              .disabled(streamingMode == "web")
                          } header: {
                              Text("Lecture en ligne")
                          } footer: {
                              Text("Automatique : audio AAC seul sur réseau mobile ou réseau limité, Web sur Wi-Fi. Une erreur audio bascule sur le Web pour le même morceau. S'applique au prochain titre. Les téléchargements restent lus localement.")
                          }
          
          ''')
          
          # Native playback currently selects the highest stream irrespective of mobile
          # connection. Select only original AAC audio formats; no video formats allowed.
          replace_once('Services/Player/YTMusicNativePlayer.swift',
              '''        let result = await streamFetcher.fetchStream(videoId: videoId) { response in
                      response.bestHighQualityFormat()
                  }
          
                  switch result {''',
              '''        let desiredQuality = UserDefaults.standard.string(forKey: "mixtape.ios18.streamingQuality") ?? "balanced"
                  let result = await streamFetcher.fetchStream(videoId: videoId) { response in
                      let audioOnly = response.streamingData?.adaptiveFormats.filter {
                          $0.isAudio && $0.isAVPlayerCompatible && $0.url != nil && $0.isOriginal
                      } ?? []
                      guard !audioOnly.isEmpty else { return nil }
                      switch desiredQuality {
                      case "economical":
                          return audioOnly.min { ($0.bitrate ?? Int.max) < ($1.bitrate ?? Int.max) }
                      case "maximum":
                          return audioOnly.max { ($0.bitrate ?? 0) < ($1.bitrate ?? 0) }
                      default:
                          return audioOnly.min {
                              abs(($0.bitrate ?? 128_000) - 128_000) <
                              abs(($1.bitrate ?? 128_000) - 128_000)
                          }
                      }
                  }
          
                  // An earlier track or a Web fallback may have cancelled this native load.
                  // In that situation, never start audio from the obsolete asynchronous result.
                  guard currentVideoId == videoId else { return }
          
                  switch result {''')
          
          # On native failure, never synthesize an ended-track event (which skipped to
          # the next song in older builds). Route errors to PlayerManager's Web fallback.
          replace_once('Services/Player/YTMusicNativePlayer.swift',
