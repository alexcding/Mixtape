      - name: Fix iOS18 launch crash in WebKit cookie restoration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V28_WEBKIT_COOKIES'
          from pathlib import Path
          import re

          source_path = Path('Services/WebKit/WebKitManager.swift')
          src = source_path.read_text(encoding='utf-8')
          old = '''        // Always restore auth cookies from Keychain backup on startup
                  // Keychain is our source of truth since WebKit storage can be unreliable
                  Task {
                      await self.restoreAuthCookiesFromBackup()
                  }'''
          new = '''        // iOS 18 crash hotfix: avoid the Swift async overlay for
                  // WKHTTPCookieStore.setCookie(_:) during application startup.
                  // Restore only when the persistent WebKit store lacks valid auth cookies.
                  self.restoreAuthCookiesFromBackup()'''
          if src.count(old) != 1:
              raise SystemExit(f'WebKit startup anchor mismatch ({src.count(old)} matches)')
          src = src.replace(old, new, 1)

          pattern = re.compile(
              r'    /// Restores auth cookies from Keychain backup to WebKit\.\n'
              r'    /// Keychain is the source of truth - always restore on startup\.\n'
              r'    private func restoreAuthCookiesFromBackup\(\) async \{.*?\n    \}\n\n'
              r'(?=    /// Creates a WebView configuration using the shared persistent data store\.)',
              re.S,
          )
          replacement = '''    /// Restore only missing auth cookies, without WebKit's Swift async wrapper.
              /// The iOS 18 crash report shows a SIGSEGV while resuming the WebKit
              /// SetCookie async continuation on the main thread. Completion handlers
              /// avoid that specific continuation path.
              private func restoreAuthCookiesFromBackup() {
                  let cookieStore = self.dataStore.httpCookieStore
                  cookieStore.getAllCookies { [weak self] existingCookies in
                      Task { @MainActor [weak self] in
                          guard let self else { return }

                          let now = Date()
                          let hasValidSession = existingCookies.contains { cookie in
                              let isAuth = cookie.name == "SAPISID" ||
                                  cookie.name == "__Secure-3PAPISID"
                              let isCurrent = cookie.expiresDate.map { $0 > now } ?? true
                              return isAuth && isCurrent
                          }

                          if hasValidSession {
                              self.logger.info("WebKit already has valid YouTube cookies; no restore needed")
                              return
                          }

                          guard let backupCookies = CookieBackupManager.restoreCookies(),
                                !backupCookies.isEmpty else {
                              self.logger.info("No backup auth cookies to restore")
                              return
                          }

                          self.logger.info("Restoring auth cookies via WebKit completion handlers")
                          self.restoreCookieSequentially(backupCookies, index: 0)
                      }
                  }
              }

              /// Serial callback-based restore: no `await setCookie` continuation.
              private func restoreCookieSequentially(_ cookies: [HTTPCookie], index: Int) {
                  guard index < cookies.count else {
                      self.logger.info("Completed cookie restoration")
                      return
                  }

                  self.dataStore.httpCookieStore.setCookie(cookies[index]) { [weak self] in
                      Task { @MainActor [weak self] in
                          self?.restoreCookieSequentially(cookies, index: index + 1)
                      }
                  }
              }

          '''
          src, count = pattern.subn(lambda _: replacement, src)
          if count != 1:
              raise SystemExit(f'WebKit restore function mismatch ({count} matches)')

          # Remove any remaining async setCookie calls within this file, to prevent
          # other early WebKit setCookie continuations from crashing on iOS 18.
          if 'await self.dataStore.httpCookieStore.setCookie(' in src:
              raise SystemExit('Unexpected async cookie setter remains in WebKitManager')

          source_path.write_text(src, encoding='utf-8')
          print('iOS 18 WebKit cookie crash hotfix patched:', source_path)
          PY_V28_WEBKIT_COOKIES
          git diff -- Services/WebKit/WebKitManager.swift > "$RUNNER_TEMP/webkit-cookie-crash-hotfix.patch" || true
          echo 'WebKit cookie restoration crash hotfix applied'

      - name: Reserve bottom scroll space on all four tabs (iOS 18)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V29_BOTTOM_SCROLL'
          #!/usr/bin/env python3
          """Add bottom scrolling clearance for all four iOS 18 tabs without resizing the player.

          Applies to AppCoordinatorView.swift AFTER the existing v28 compatibility and
          mini-bar steps, operating on the original repository checkout.
          """
          from pathlib import Path
          import re

          path = Path('Coordinators/App/AppCoordinatorView.swift')
          source = path.read_text(encoding='utf-8')

          needle = '''    private func iOSMainContent() -> some View {
                  TabView(selection: $coordinator.navigationSelection) {'''
          replacement = '''    private func iOSMainContent() -> some View {
                  // iOS 18: reserve extra scroll room below every tab while the mini
                  // player is visible. This does not shrink or relocate the player.
                  // The space is released immediately when the mini player is hidden.
                  let miniPlayerScrollClearance: CGFloat =
                      playerManager.currentTrack != nil && !isMiniBarCollapsed ? 84 : 0

                  TabView(selection: $coordinator.navigationSelection) {'''
          if source.count(needle) != 1:
              raise SystemExit(f'iOS 18 content anchor expected once, got {source.count(needle)}')
          source = source.replace(needle, replacement, 1)

          for title in ('Home', 'Discovery', 'Library', 'Search'):
              # Wrap the content of this Tab (the LazyView) in a safe-area spacer, not the
              # tab bar itself. The native ScrollView/List sees a smaller viewport and
              # can scroll its last row completely above the visible mini-player.
              pat = re.compile(
                  r'(?P<prefix>Tab\("' + re.escape(title) + r'",[^\n]*\)\s*\{\s*LazyView\s*\{[\s\S]*?\n {16}\}\n)'
                  r'(?P<close> {12}\})'
              )
              indent = ' '*16
              spacer = (indent + '.safeAreaInset(edge: .bottom, spacing: 0) {\n'
                        + indent + '    Color.clear\n'
                        + indent + '        .frame(height: miniPlayerScrollClearance)\n'
                        + indent + '        .allowsHitTesting(false)\n'
                        + indent + '}\n')
              source, count = pat.subn(lambda m: m.group('prefix') + spacer + m.group('close'), source, count=1)
              if count != 1:
                  raise SystemExit(f'Cannot inject scrolling clearance into Tab {title}: {count} matches')

          path.write_text(source, encoding='utf-8')
          print('Bottom scroll clearance added for Home, Discovery, Library, Search')
          PY_V29_BOTTOM_SCROLL
          git diff -- Coordinators/App/AppCoordinatorView.swift > "$RUNNER_TEMP/ios18-mini-player-scroll-clearance.patch" || true

